<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>三角洲放置 · 行动指挥部</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { pixel: ['"Courier New"', 'monospace'] },
        colors: {
          ink: '#0b0e0c',
          panel: '#141a16',
          panel2: '#1b231d',
          line: '#2c3830',
          delta: '#c8ff3d',
          sand: '#d9d3bd',
          rust: '#ff5c3d'
        }
      }
    },
    safelist: [
      'text-delta', 'text-rust', 'text-sand', 'text-amber-400', 'text-sky-400', 'text-fuchsia-400',
      'border-delta/50', 'border-rust/50', 'border-amber-400/50', 'border-sky-400/50', 'border-fuchsia-400/50'
    ]
  }
</script>
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/stage.css" />
</head>
<body class="bg-ink text-sand font-pixel min-h-screen flex flex-col">

  <div id="topbar-root"></div>

  <main class="flex-1 w-full max-w-[1600px] mx-auto px-3 md:px-6 py-4">
    <section id="view-prepare" class="view"></section>
    <section id="view-explore" class="view hidden"></section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-20 right-4 z-[60] flex flex-col gap-2 items-end"></div>

  <footer class="border-t border-line bg-panel/60 py-4 text-center text-xs text-sand/50">
    <p>三角洲放置 · 本阶段仅实现系统机制与交互流程，数值待后续注入</p>
    <p>由 <a href="https://with.woa.com/" style="color: #8A2BE2;" target="_blank">With</a> 通过自然语言生成</p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
